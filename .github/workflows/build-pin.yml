name: Build Pin IPA

on:
  push:
    branches: ["**", "!pin-log"]
    paths:
      - "Pin/**"
      - ".github/workflows/build-pin.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Pin

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Dessiner l'icône
        run: swift outils/icone.swift Pin/Ressources/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project Pin.xcodeproj -scheme Pin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            grep -E "error:" build.log | head -80
            exit 1
          fi
          grep -E "\*\* BUILD" build.log
          test -f build/Build/Products/Release-iphoneos/Pin.app/Pin
      - name: Publier le journal de compilation (branche pin-log)
        if: always()
        run: |
          { echo "run: ${{ github.run_id }}  commit: ${{ github.sha }}  statut: ${{ job.status }}"; echo;
            grep -E "error:|warning: .*(deprecated|will never|never mutated|unused)" build.log | sort -u | head -150 || true;
            echo; echo "---- fin du log ----"; tail -40 build.log || true; } > /tmp/compile.txt
          cd "$RUNNER_TEMP" && rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q && git checkout -q -b pin-log
          cp /tmp/compile.txt compile.txt
          git -c user.name=ci -c user.email=ci@local add compile.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pin-log
      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pin.app Payload/
          zip -qry Pin.ipa Payload
          ls -lh Pin.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Pin-ipa
          path: Pin/Pin.ipa
      - name: Déterminer la version
        id: version
        run: echo "tag=pin-v$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)" >> "$GITHUB_OUTPUT"
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pin ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Pin/Pin.ipa
          make_latest: false
          body: |
            IPA non signée de Pin — l'iPod de l'écosystème dipherant : WhatsApp, Claude, Photos, Musique (Telegram).
            Installez-la avec SideStore, AltStore ou Sideloadly.
