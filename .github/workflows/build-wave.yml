name: Build Wave IPA

on:
  push:
    branches: ["**"]
    paths:
      - "Wave/**"
      - ".github/workflows/build-wave.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Wave

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          # Échoue réellement si la compilation échoue (auparavant une IPA vide était publiée).
          if ! xcodebuild \
            -project Wave.xcodeproj \
            -scheme Wave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            grep -E "error:" build.log | head -50
            exit 1
          fi
          grep -E "\*\* BUILD" build.log
          test -f build/Build/Products/Release-iphoneos/Wave.app/Wave

      - name: Afficher les erreurs
        if: failure()
        run: grep -E "error:" build.log | head -50 || true

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Wave.app Payload/
          zip -qry Wave.ipa Payload
          ls -lh Wave.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Wave-ipa
          path: Wave/Wave.ipa

      - name: Déterminer la version
        id: version
        run: echo "tag=wave-v$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Wave ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Wave/Wave.ipa
          overwrite_files: true
          make_latest: false
          body: |
            IPA non signée de Wave — détecteur d'ondes (caméras et micros cachés, satellites, réseau, magnétomètre).
            Installez-la avec SideStore, AltStore ou Sideloadly.
