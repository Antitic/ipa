name: Build IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project Bloutouss.xcodeproj \
            -scheme Bloutouss \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Bloutouss.app Payload/
          zip -qry Bloutouss.ipa Payload
          ls -lh Bloutouss.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Bloutouss-ipa
          path: Bloutouss.ipa

      - name: Déterminer la version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bloutouss ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Bloutouss.ipa
          overwrite_files: true
          body: |
            IPA non signée de Bloutouss — scanner d'appareils Bluetooth à proximité.
            Installez-la avec AltStore, Sideloadly ou TrollStore.
