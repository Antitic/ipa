name: Pin
options:
  bundleIdPrefix: com.antitic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Pin:
    type: application
    platform: iOS
    sources:
      - path: Pin
    info:
      path: Pin/Info.plist
      properties:
        CFBundleDisplayName: Pin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Pin prend des photos avec l'appareil photo de l'iPhone.
        NSPhotoLibraryUsageDescription: Pin affiche ta Pellicule et envoie des photos sur WhatsApp.
        NSPhotoLibraryAddUsageDescription: Pin enregistre les photos prises dans ta Pellicule.
        NSMicrophoneUsageDescription: Pin enregistre tes vocaux WhatsApp et la dictée.
        NSSpeechRecognitionUsageDescription: Pin transforme ta voix en texte pour écrire tes messages.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antitic.pin
        PRODUCT_NAME: Pin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Pin:
    build:
      targets:
        Pin: all
    run:
      config: Debug
    archive:
      config: Release
