name: Wave
options:
  bundleIdPrefix: com.tikawski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Wave:
    type: application
    platform: iOS
    sources:
      - path: Wave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tikawski.wave
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Wave/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Wave/Info.plist
      properties:
        CFBundleDisplayName: Wave
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Wave scanne les appareils Bluetooth à proximité pour détecter caméras, micros et traceurs.
        NSCameraUsageDescription: Wave utilise la caméra pour repérer les LED infrarouges des caméras cachées.
        NSMicrophoneUsageDescription: Wave analyse le son pour détecter les balises ultrasonores.
        NSLocationWhenInUseUsageDescription: Wave a besoin de ta position pour calculer les satellites au-dessus de toi.
        NSMotionUsageDescription: Wave lit le magnétomètre pour mesurer le champ magnétique.
        NSLocalNetworkUsageDescription: Wave scanne ton réseau local pour trouver les appareils connectés.
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _rtsp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
          - _hap._tcp
          - _homekit._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _companion-link._tcp
          - _spotify-connect._tcp
          - _sonos._tcp
          - _amzn-wplay._tcp
          - _device-info._tcp
          - _workstation._tcp
          - _matter._tcp
          - _meshcop._udp
          - _axis-video._tcp
          - _nvstream._tcp
          - _webdav._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
